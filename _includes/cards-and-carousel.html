<div
  class="carousel"
  data-carousel
  aria-label="Galerie de proiecte Freshouse"
  aria-roledescription="carousel"
  tabindex="0"
>
  <button
    class="carousel-button prev"
    data-carousel-previous
    type="button"
    aria-label="Imaginile anterioare"
  >
    &#10094;
  </button>

  <div class="carousel-track" data-carousel-track>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse1.jpg' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 1">
    </div>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse2.png' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 2">
    </div>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse3.jpg' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 3">
    </div>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse4.png' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 4">
    </div>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse5.jpg' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 5">
    </div>
    <div class="carousel-slide">
      <img src="{{ '/assets/carousel/freshouse6.jpg' | relative_url }}" alt="Profil decorativ Freshouse — fotografie 6">
    </div>
  </div>

  <button
    class="carousel-button next"
    data-carousel-next
    type="button"
    aria-label="Imaginile următoare"
  >
    &#10095;
  </button>
</div>

<div
  class="carousel-indicators"
  data-carousel-indicators
  aria-label="Selectează imaginile afișate"
></div>
