<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <img
        src="{{ '/assets/hero-interior-logo.avif' | relative_url }}"
        alt="{{ site.title | escape }}"
      >
    </a>

    <nav class="site-nav" aria-label="Navigație principală">
      <button
        class="nav-toggle"
        type="button"
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Deschide meniul"
      >
        <span class="nav-toggle-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <div id="primary-navigation" class="trigger">
        {% for item in site.data.navigation %}
          <a
            class="page-link{% if page.url == item.url %} active{% endif %}"
            href="{{ item.url | relative_url }}"
            {% if page.url == item.url %}aria-current="page"{% endif %}
          >
            {{ item.title }}
          </a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
