---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}

    <div class="contact-card">
      <h3>Transformă-ți casa în locuința visurilor!</h3>
      <ul class="contact-list">
        <li>
          <span class="icon">📞</span>
          <a href="tel:+40724507336">+40 724 507 336</a>
        </li>
        <li>
          <span class="icon">✉️</span>
          <a href="mailto:vanzari.daminci@gmail.com"
            >vanzari.daminci@gmail.com</a
          >
        </li>
        <li>
          <span class="icon">⏰</span>
          Luni - Vineri, 9:00 - 17:00
        </li>
      </ul>
    </div>

    <div class="container">
      <form
        action="https://formsubmit.co/26804c9ee6a4e994726b7daded526e57"
        method="POST"
        class="contact-form"
      >
        <input type="hidden" name="_captcha" value="false" />
        <input
          type="hidden"
          name="_next"
          value="{{ '/thank-you/' | absolute_url }}"
        />

        <h2>Trimite-ne un mesaj</h2>

        <div class="form-group">
          <div class="form-row">
            <div class="col">
              <label class="form-label" for="name">
                Nume <span aria-hidden="true">*</span>
              </label>
              <input
                id="name"
                type="text"
                name="name"
                class="form-control"
                autocomplete="name"
                required
              />
            </div>

            <div class="col">
              <label class="form-label" for="email">
                Adresa de email <span aria-hidden="true">*</span>
              </label>
              <input
                id="email"
                type="email"
                name="email"
                class="form-control"
                autocomplete="email"
                inputmode="email"
                required
              />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Numărul de telefon</label>
          <input
            id="phone"
            type="tel"
            name="phone"
            class="form-control"
            autocomplete="tel"
            inputmode="tel"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="message">
            Mesaj <span aria-hidden="true">*</span>
          </label>
          <textarea
            id="message"
            name="message"
            class="form-control"
            rows="10"
            required
          ></textarea>
        </div>

        <p class="form-note">
          <span aria-hidden="true">*</span> Câmpuri obligatorii
        </p>

        <button type="submit" class="btn btn-lg btn-dark btn-block">
          Trimite mesajul
        </button>
      </form>
    </div>
  </div>
</article>
