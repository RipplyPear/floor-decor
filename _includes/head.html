<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cards-and-carousel.css' | relative_url }}">

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  {% if page.title == "Contact" %}
    <link
      rel="stylesheet"
      href="{{ '/assets/css/contact.css' | relative_url }}"
    >
  {% endif %}
  
  {% if page.layout == "home" %}
    <link
      rel="stylesheet"
      href="{{ '/assets/css/cards-and-carousel.css' | relative_url }}"
    >
    <script
      src="{{ '/assets/js/cards-and-carousel.js' | relative_url }}"
      defer
    ></script>
  {% endif %}

</head>
