<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/cards-and-carousel.css' | relative_url }}">
<!--  <script src="{{ "/assets/cards-and-carousel.js" | relative_url }}"></script>-->
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  {% if page.title == "Contact" %}
    <link
      rel="stylesheet"
      href="{{ '/assets/contact.css' | relative_url }}"
    >
  {% endif %}
  
  {% if page.title == "Acasă" %}

  <script>
  
    ;(function() {
      // ─── Carousel JS ───────────────────────────────────────────
      const track       = document.querySelector('.carousel-track');
      const slides      = Array.from(track.children);
      const prevBtn     = document.querySelector('.carousel-button.prev');
      const nextBtn     = document.querySelector('.carousel-button.next');
      const dotsContainer = document.querySelector('.carousel-indicators');
      let   currentIndex = 0;

      // build dashes
      slides.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'dash' + (i === 0 ? ' active' : '');
        dot.dataset.index = i;
        dotsContainer.appendChild(dot);
      });
      const dots = Array.from(dotsContainer.children);

      function goToSlide(idx) {
        if (idx < 0) idx = slides.length - 1;
        if (idx >= slides.length) idx = 0;
        track.style.transform = `translateX(-${idx * 100}%)`;
        dots[currentIndex].classList.remove('active');
        dots[idx].classList.add('active');
        currentIndex = idx;
      }

      prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
      nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
      dots.forEach(d => d.addEventListener('click', e => goToSlide(+e.target.dataset.index)));
    })();

  </script>

  {% endif %}

</head>
